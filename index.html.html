      { id: 12, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "ความสมบูรณ์ของสัญญาผ่านอีเมล (มาตรา 7)", question: "(พรบ. ธุรกรรม) บริษัทส่ง PO และตอบรับยืนยันผ่านทางอีเมล ต่อมาฝ่ายขายอ้างว่าอีเมลไม่ใช่สัญญาเพราะไม่ได้เซ็นบนกระดาษ ข้ออ้างถูกต้องหรือไม่?", choices: ["ไม่แน่นอน กฎหมายไม่ได้ครอบคลุมนิติบุคคล", "ถูกต้อง สัญญามูลค่าสูงต้องทำเป็นกระดาษ", "ไม่ถูกต้อง เพราะมาตรา 7 บัญญัติห้ามมิให้ปฏิเสธผลผูกพันทางกฎหมายของข้อความเพียงเพราะอยู่ในรูปของข้อมูลอิเล็กทรอนิกส์", "ถูกต้อง เฉพาะกรณีเกิน 2 ล้านบาท"], answerIndex: 2, note: "ตาม พ.ร.บ.ธุรกรรมอิเล็กทรอนิกส์ มาตรา 7 บัญญัติห้ามมิให้ปฏิเสธความมีผลผูกพันและการบังคับใช้ทางกฎหมายของข้อความใด เพียงเพราะเหตุที่ข้อความนั้นอยู่ในรูปของข้อมูลอิเล็กทรอนิกส์" },
      { id: 13, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "หลัก Party Autonomy ในธุรกรรมอิเล็กทรอนิกส์", question: "(พรบ. ธุรกรรม) สองบริษัทตกลงกันว่าจะใช้ลายเซ็นบน Touchscreen แทน PKI ในการอนุมัติภายใน สอดคล้องกับหลักการใด?", choices: ["หลัก Non-Discrimination เพียงอย่างเดียว", "หลัก Party Autonomy ที่เปิดให้คู่สัญญาสามารถตกลงกันเองได้ว่าจะใช้วิธีการใด", "หลัก Functional Equivalence เพียงอย่างเดียว", "ไม่สอดคล้องกับหลักการใดเลย"], answerIndex: 1, note: "หลัก Party Autonomy (เจตจำนงอิสระของคู่สัญญา) ให้สิทธิคู่กรณีในการตกลงเลือกวิธีการ รูปแบบ หรือระดับความปลอดภัยของเทคโนโลยีที่เหมาะสมในการทำธุรกรรมร่วมกันได้" },
      { id: 14, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "เวลาการรับข้อมูลอิเล็กทรอนิกส์ (มาตรา 24)", question: "(พรบ. ธุรกรรม) ส่งสัญญาเข้า LINE ส่วนตัวซึ่งไม่ใช่ช่องทางทางการที่กำหนดไว้ จะถือว่า 'ได้รับ' เอกสารเมื่อใด?", choices: ["ถือว่าได้รับเมื่อผู้รับสามารถเข้าถึง (เปิดอ่าน) ข้อความนั้นได้จริง เนื่องจากมิใช่ระบบที่กำหนดไว้เฉพาะ", "ถือว่าไม่มีผลทางกฎหมาย", "นับเวลาที่ได้รับจากวันถัดไปเสมอ", "ถือว่าได้รับทันทีที่ส่งออกจากเครื่องผู้ส่ง"], answerIndex: 0, note: "ตามมาตรา 24 วรรคสอง หากส่งไปยังระบบสารสนเทศของผู้รับที่ไม่ได้กำหนดไว้เฉพาะเจาะจง ให้ถือว่าการรับมีผลเมื่อผู้รับสามารถเข้าถึงข้อมูลนั้นได้จริง (เปิดอ่าน)" },
      { id: 15, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "พยานหลักฐานทางอิเล็กทรอนิกส์ในชั้นศาล", question: "(พรบ. ธุรกรรม) การที่ศาลจะเชื่อถือพยานหลักฐานทางอิเล็กทรอนิกส์หรือไม่นั้นขึ้นอยู่กับข้อใด?", choices: ["การชั่งน้ำหนักพยานหลักฐานของศาลเอง", "ความน่าเชื่อถือของพยานหลักฐาน", "ถูกทั้ง ข้อ ก. และ ข้อ ข.", "ต้องเชื่อเสมอ เพราะถือเป็นหลักฐาน"], answerIndex: 2, note: "ตามมาตรา 11 การรับฟังพยานหลักฐานอิเล็กทรอนิกส์ ศาลต้องพิจารณาถึงความน่าเชื่อถือของกระบวนการสร้าง การเก็บรักษา ความครบถ้วนของข้อมูล ควบคู่กับการใช้ดุลยพินิจในการชั่งน้ำหนักพยานหลักฐานของศาล" },
      { id: 16, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "หลัก Technology Neutrality", question: "(พรบ. ธุรกรรม) Technology Neutrality (ความเท่าเทียมของเทคโนโลยี) ใช้ในการวินิจฉัยมาตราใด?", choices: ["มาตรา 9", "มาตรา 5", "มาตรา 7", "มาตรา 8"], answerIndex: 2, note: "มาตรา 7 สะท้อนหลักการ Technology Neutrality / Non-discrimination โดยห้ามปฏิเสธผลทางกฎหมายเพียงเพราะอยู่ในรูปแบบข้อมูลอิเล็กทรอนิกส์ ไม่ว่าจะสร้างขึ้นด้วยเทคโนโลยีใด" },
      { id: 17, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "หลักการพื้นฐานของ พ.ร.บ.ธุรกรรมฯ", question: "(พรบ. ธุรกรรม) ข้อใดไม่ใช่หลักการพื้นฐานของ พ.ร.บ.ธุรกรรมฯ?", choices: ["คู่สัญญาตกลงใช้ร่วมกัน", "ถ้ามีระบบอิเล็กทรอนิกส์ต้องยกเลิกระบบกระดาษ", "รองรับทุกเทคโนโลยี", "ความเท่าเทียมกันระหว่าง “กระดาษ” และ “ข้อมูลอิเล็กทรอนิกส์”"], answerIndex: 1, note: "พ.ร.บ.ธุรกรรมฯ มุ่งเน้นรับรองความเท่าเทียมกันทางหน้าที่ (Functional Equivalence) ของข้อมูลอิเล็กทรอนิกส์กับกระดาษ กฎหมายไม่ได้บังคับให้ต้องยกเลิกระบบกระดาษเดิม" },
      { id: 18, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "การเลือกใช้สัญญา Unilateral NDA", question: "(NDA) จ้างที่ปรึกษาอิสระเข้ามาพัฒนาระบบ ซึ่งที่ปรึกษาเข้าถึงข้อมูลลับของบริษัทฝ่ายเดียว ควรใช้สัญญา NDA ประเภทใด?", choices: ["Unilateral NDA (สัญญาฝ่ายเดียว)", "Mutual NDA (สัญญาสองฝ่าย)", "Non-Compete Agreement", "Multilateral NDA (สัญญาหลายฝ่าย)"], answerIndex: 0, note: "Unilateral NDA (สัญญาฝ่ายเดียว) เหมาะสำหรับกรณีที่มีฝ่ายหนึ่งเป็นผู้เปิดเผยข้อมูลลับ (บริษัท) และอีกฝ่ายเป็นผู้รับข้อมูลลับเพื่อปฏิบัติงานแต่เพียงฝ่ายเดียว (ที่ปรึกษา)" },
      { id: 19, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "ขอบเขต NDA และการไปทำงานกับคู่แข่ง", question: "(NDA) เซ็นเฉพาะ NDA (ไม่ได้ทำ Non-Compete) แล้วไปทำงานบริษัทคู่แข่งโดยไม่ได้นำความลับไปเปิดเผย ถือว่าฝ่าฝืนหรือไม่?", choices: ["ขึ้นอยู่กับตำแหน่งงานใหม่", "ไม่ฝ่าฝืน เพราะ NDA คุ้มครองเฉพาะความลับ ไม่ได้ห้ามไปทำงานกับคู่แข่ง", "ฝ่าฝืน เพราะ NDA ครอบคลุมการห้ามทำงานกับคู่แข่งเสมอ", "ฝ่าฝืนในทุกกรณี"], answerIndex: 1, note: "สัญญา NDA (Non-Disclosure Agreement) มีขอบเขตคุ้มครองเฉพาะการห้ามเปิดเผยข้อมูลลับ หากไม่มีการทำข้อตกลงห้ามแข่งขัน (Non-Compete) และไม่ได้นำความลับไปเปิดเผย ย่อมสามารถไปทำงานกับคู่แข่งได้โดยไม่ผิดสัญญา" },
      { id: 20, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "การถูก Phishing OTP และความน่าเชื่อถือลายมือชื่อ (มาตรา 26)", question: "(พรบ. ธุรกรรม) ลูกค้าถูก Phishing หลอกเอา OTP โอนเงิน ข้อโต้แย้งใดสอดคล้องกับหลักกฎหมายมากที่สุด?", choices: ["OTP ไม่ถือเป็นลายมือชื่ออิเล็กทรอนิกส์ในทุกกรณี", "OTP ที่ถูกขโมยมีผลผูกพันเสมอ", "ต้องพิจารณาความน่าเชื่อถือตามมาตรา 26 ด้วยว่าข้อมูลที่ใช้ยังคงอยู่ภายใต้การควบคุมของเจ้าของลายมือชื่อจริงหรือไม่", "ธนาคารไม่ต้องรับผิดชอบใดๆ"], answerIndex: 2, note: "มาตรา 26 บัญญัติว่า ลายมือชื่ออิเล็กทรอนิกส์ที่เชื่อถือได้ ข้อมูลที่ใช้สร้างลายมือชื่อ (เช่น OTP/รหัสผ่าน) ต้องอยู่ภายใต้การควบคุมของเจ้าของลายมือชื่อในขณะสร้าง หากถูกขโมย/หลอกลวง ย่อมส่งผลต่อความน่าเชื่อถือและผลผูกพัน" },
      { id: 21, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "สัญญา Mutual NDA ในการเจรจา Joint Venture", question: "(NDA) สองบริษัทเจรจาร่วมทุน (Joint Venture) และจำเป็นต้องแลกเปลี่ยนข้อมูลลับทางการเงินของทั้งสองฝ่าย ควรใช้สัญญาใด?", choices: ["Unilateral NDA", "ไม่จำเป็นต้องทำ NDA", "ทำ NDA แยกฝ่ายละฉบับไม่ผูกพันกัน", "Mutual NDA (สัญญาสองฝ่าย)"], answerIndex: 3, note: "Mutual NDA (สัญญาสองฝ่าย/สัญญาต่างตอบแทน) ใช้เมื่อทั้งสองฝ่ายจำเป็นต้องแลกเปลี่ยนและเปิดเผยข้อมูลลับซึ่งกันและกัน โดยทั้งสองฝ่ายต่างมีหน้าที่รักษาความลับของอีกฝ่าย" },
      { id: 22, category: "cat2", categoryName: "หมวด 2: พ.ร.บ. ธุรกรรมฯ & NDA", title: "ขอบเขตธุรกรรมทางอิเล็กทรอนิกส์", question: "(พรบ. ธุรกรรม) ข้อใดไม่ถือเป็น “ธุรกรรมทางอิเล็กทรอนิกส์”?", choices: ["การโพสต์ข่าวสารบน facebook", "การโอนเงินด้วยระบบอัตโนมัติผ่านเครือข่าย", "การตกลงทำสัญญาซื้อ-ขายบนเครือข่าย", "การซื้อ-ขายสินค้าผ่านเครือข่ายอินเทอร์เน็ต"], answerIndex: 0, note: "ธุรกรรมทางอิเล็กทรอนิกส์ หมายถึง กิจกรรมทางแพ่งและพาณิชย์ หรือการดำเนินงานของหน่วยงานรัฐที่ใช้วิธีการทางอิเล็กทรอนิกส์ ส่วนการโพสต์ข่าวสารบน Facebook เป็นการสื่อสาร/แสดงความเห็นทั่วไป ไม่ใช่นิติกรรมหรือธุรกรรมทางการค้า" },

      // หมวด 3
      { id: 23, category: "cat3", categoryName: "หมวด 3: พ.ร.บ.คอมพิวเตอร์", title: "การปิดระบบ Maintenance ในฐานะ Admin", question: "(พรบ.คอมพ์) System Admin ปิดระบบลงทะเบียนเพื่อทำ maintenance ทำให้ประชาชนเข้าใช้งานไม่ได้ ผิดมาตราใด?", choices: ["ไม่ผิด เพราะถือเป็นการปฏิบัติงานในหน้าที่", "มาตราที่ 10", "มาตราที่ 9", "มาตราที่ 8"], answerIndex: 0, note: "การปิดระบบเพื่อบำรุงรักษา (Maintenance) เป็นการปฏิบัติงานโดยชอบตามอำนาจหน้าที่ของ System Admin จึงไม่มีเจตนากระทำความผิดโดยมิชอบตาม พ.ร.บ.คอมพิวเตอร์" },
      { id: 24, category: "cat3", categoryName: "หมวด 3: พ.ร.บ.คอมพิวเตอร์", title: "การ View Source ของเว็บไซต์สาธารณะ", question: "(พรบ.คอมพ์) การกด View Source ของเว็บ www.google.com มีความผิดข้อใด?", choices: ["มาตรา 6", "ไม่ผิด เพราะเป็นการเข้าถึงข้อมูลที่ไม่มีมาตรการป้องกันเฉพาะ", "มาตรา 5", "มาตรา 7"], answerIndex: 1, note: "Source code ของหน้าเว็บที่เปิดเผยต่อสาธารณะผ่านเบราว์เซอร์ เป็นข้อมูลที่ไม่มีมาตรการป้องกันการเข้าถึงเฉพาะไว้ จึงไม่เข้าข่ายความผิดฐานเข้าถึงระบบหรือข้อมูลโดยมิชอบ" },
      { id: 25, category: "cat3", categoryName: "หมวด 3: พ.ร.บ.คอมพิวเตอร์", title: "การใช้โปรแกรม Bot ช่วยเล่นเกม", question: "(พรบ.คอมพ์) ผู้ใช้ Bot โปรแกรมช่วยเล่นเกม มีความผิดตามมาตราใด?", choices: ["มาตราที่ 5, 7", "มาตราที่ 13", "มาตราที่ 9", "มาตราที่ 8"], answerIndex: 2, note: "มาตรา 9: การรบกวน แก้ไข เปลี่ยนแปลง หรือเพิ่มเติมข้อมูลคอมพิวเตอร์ของผู้อื่นโดยมิชอบ (การใช้โปรแกรมบอทส่งชุดคำสั่งเข้าไปแทรกแซงหรือแก้ไขข้อมูลในเซิร์ฟเวอร์เกม)" },
      { id: 26, category: "cat3", categoryName: "หมวด 3: พ.ร.บ.คอมพิวเตอร์", title: "การใช้นามแฝงส่งอีเมล", question: "(พรบ.คอมพ์) การใช้อีเมลนามแฝงส่งข้อความหาคนทั้งมหาวิทยาลัย ถือว่าผิดตามมาตราใด?", choices: ["มาตราที่ 14", "จากข้อมูลเพียงเท่านี้ ไม่ถือว่าผิดมาตราใด ๆ", "มาตราที่ 13", "มาตราที่ 11"], answerIndex: 1, note: "การใช้นามแฝงส่งอีเมลเพียงอย่างเดียว หากไม่ได้มีเนื้อหาที่เป็นเท็จ/เสียหาย (ม.14) หรือไม่ได้ปกปิดแหล่งกำเนิดเพื่อก่อความเดือดร้อนรำคาญ (สแปม - ม.11) จากข้อมูลเพียงเท่านี้จึงยังไม่ถือเป็นความผิด" },

      { id: 29, category: "cat3", categoryName: "หมวด 3: พ.ร.บ.คอมพิวเตอร์", title: "การดักรับ/สอดแนมข้อมูลการติดต่อสื่อสาร", question: "(พรบ.คอมพ์) หน่วยงานรัฐเข้าไปดักสอดแนมข้อมูลการติดต่อสื่อสารของประชาชนโดยมิชอบ ผิดมาตราใด?", choices: ["มาตรา 8", "ไม่ผิด เพราะเป็นรัฐบาล", "มาตรา 5", "มาตรา 7"], answerIndex: 0, note: "มาตรา 8: การดักรับข้อมูลคอมพิวเตอร์ของผู้อื่นโดยมิชอบ ซึ่งอยู่ระหว่างการส่งในระบบคอมพิวเตอร์" },
      { id: 30, category: "cat3", categoryName: "หมวด 3: พ.ร.บ.คอมพิวเตอร์", title: "การปล่อยไวรัสทำลายระบบคอมพิวเตอร์", question: "(พรบ.คอมพ์) การป้อนโปรแกรมที่มีไวรัสทำลายข้อมูลหรือขัดขวางการทำงานของระบบ เข้าข่ายผิดมาตราใด?", choices: ["มาตรา 10", "มาตรา 5", "มาตรา 7", "มาตรา 9"], answerIndex: 0, note: "มาตรา 10: การกระทำใดโดยมิชอบ เพื่อให้การทำงานของระบบคอมพิวเตอร์ของผู้อื่นถูกระงับ ชะลอ ขัดขวาง หรือรบกวนจนไม่สามารถทำงานตามปกติได้" },
      { id: 31, category: "cat3", categoryName: "หมวด 3: พ.ร.บ.คอมพิวเตอร์", title: "การแฮกระบบหน่วยงานรัฐและโพสต์ข้อมูล", question: "(พรบ.คอมพ์) แฮกระบบกองทัพภาคที่ 2 และบันทึกภาพหน้าเว็บมาโพสต์ ผิดมาตราใดบ้าง?", choices: ["มาตราที่ 12", "มาตราที่ 5, 7, 14", "มาตราที่ 5, 7, 12", "มาตราที่ 5, 7"], answerIndex: 1, note: "ม.5 เข้าถึงระบบคอมพิวเตอร์โดยมิชอบ, ม.7 เข้าถึงข้อมูลคอมพิวเตอร์โดยมิชอบ, และ ม.14 นำเข้าข้อมูลสู่ระบบคอมพิวเตอร์ที่น่าจะเกิดความเสียหายต่อความมั่นคง" },
      { id: 32, category: "cat3", categoryName: "หมวด 3: พ.ร.บ.คอมพิวเตอร์", title: "นิยามข้อมูลการติดต่อสื่อสารของระบบ", question: "(พรบ.คอมพ์) ข้อใดคือข้อมูลเกี่ยวกับการติดต่อสื่อสารของระบบคอมพิวเตอร์?", choices: ["“ข้อมูลคอมพิวเตอร์”", "“ข้อมูลจราจรทางคอมพิวเตอร์” (Traffic Data)", "“ข้อมูลอิเล็กทรอนิกส์”", "“ระบบคอมพิวเตอร์”"], answerIndex: 1, note: "“ข้อมูลจราจรทางคอมพิวเตอร์” (Traffic Data) คือข้อมูลเกี่ยวกับการติดต่อสื่อสารของระบบคอมพิวเตอร์ เช่น แหล่งกำเนิด ต้นทาง ปลายทาง เส้นทาง เวลา วันที่ ปริมาณ ระยะเวลา ชนิดของบริการ หรืออื่นๆ" },

    ];

    let currentCategory = 'all';
    let userAnswers = {};
    let isRevealAll = false;

    function renderQuestions() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      const filtered = questionsData.filter(q => currentCategory === 'all' || q.category === currentCategory);

      filtered.forEach((q) => {
        const isAnswered = userAnswers.hasOwnProperty(q.id);
        const selectedIdx = userAnswers[q.id];

        let choicesHtml = q.choices.map((choice, idx) => {
          let btnClass = "w-full text-left px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium transition hover:border-slate-300 hover:bg-slate-50";

          if (isRevealAll) {
            if (idx === q.answerIndex) btnClass += " correct-choice";
          } else if (isAnswered) {
            if (idx === q.answerIndex) {
              btnClass += " correct-choice font-bold";
            } else if (idx === selectedIdx) {
              btnClass += " wrong-choice font-bold";
            } else {
              btnClass += " opacity-50 cursor-not-allowed";
            }
          }

          return `
            <button 
              onclick="selectAnswer(${q.id}, ${idx})" 
              class="${btnClass}"
              ${isAnswered || isRevealAll ? 'disabled' : ''}>
              <span class="inline-block w-6 text-slate-400 font-mono">${String.fromCharCode(65 + idx)}.</span>
              ${choice}
            </button>
          `;
        }).join('');

        let noteHtml = (isRevealAll || isAnswered) && q.note ? `
          <div class="mt-3 p-3 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-800 font-medium">
            💡 <strong>คำอธิบาย:</strong> ${q.note}
          </div>
        ` : '';

        const card = `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 transition">
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg">${q.categoryName}</span>
              <span class="text-xs text-slate-400 font-mono">ข้อที่ ${q.id}/33</span>
            </div>
            <h3 class="text-base font-semibold text-slate-900 mb-1">${q.title}</h3>
            <p class="text-slate-700 text-sm mb-4 leading-relaxed">${q.question}</p>
            <div class="space-y-2">
              ${choicesHtml}
            </div>
            ${noteHtml}
          </div>
        `;
        container.innerHTML += card;
      });

      updateScore();
    }

    function selectAnswer(questionId, choiceIndex) {
      if (userAnswers.hasOwnProperty(questionId)) return;
      userAnswers[questionId] = choiceIndex;
      renderQuestions();
    }

    function toggleRevealAll() {
      isRevealAll = document.getElementById('toggle-reveal').checked;
      renderQuestions();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = "filter-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200";
      });
      event.target.className = "filter-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-indigo-600 text-white active";
      renderQuestions();
    }

    function updateScore() {
      let correct = 0;
      let totalAnswered = Object.keys(userAnswers).length;
      for (const [id, idx] of Object.entries(userAnswers)) {
        const q = questionsData.find(item => item.id == id);
        if (q && q.answerIndex === idx) correct++;
      }
      document.getElementById('score-display').innerText = `${correct} / ${totalAnswered}`;
    }

    function resetQuiz() {
      userAnswers = {};
      document.getElementById('toggle-reveal').checked = false;
      isRevealAll = false;
      renderQuestions();
    }

    // Init
    renderQuestions();
  </script>
</body>
